[project]
name = "zdash-backend"
version = "0.1.0"
description = "zDash Studio Server of ZeaZDev Company Limited"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "httpx>=0.28.1",
  "sqlmodel>=0.0.39",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.1",
  "APScheduler>=3.11.3",
  "PyJWT>=2.13.0",
  "passlib>=1.7.4",
  "prometheus-client>=0.26.0",
  "email-validator>=2.3.0",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff==0.16.4",
  "mypy>=2.3.0",
  "bandit>=1.9.4",
  "types-passlib>=1.7.7",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
addopts = "-q"
filterwarnings = [
  "ignore:.*'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib\\.utils",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["E701", "E702", "F403", "E741"]

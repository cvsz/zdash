name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate dependency locks on maintenance branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/post-upgrade-hardening'
        run: |
          if [ -f backend/requirements.lock ] && [ -f backend/requirements-dev.lock ]; then
            echo 'Backend locks already generated.'
            exit 0
          fi
          python -m venv /tmp/zdash-runtime
          /tmp/zdash-runtime/bin/python -m pip install --upgrade pip 'setuptools>=83' wheel
          /tmp/zdash-runtime/bin/pip install ./backend
          /tmp/zdash-runtime/bin/pip freeze \
            | grep -v '^zdash-backend' \
            | sort > backend/requirements.lock
          python -m venv /tmp/zdash-dev
          /tmp/zdash-dev/bin/python -m pip install --upgrade pip 'setuptools>=83' wheel
          /tmp/zdash-dev/bin/pip install './backend[dev]'
          /tmp/zdash-dev/bin/pip freeze \
            | grep -v '^zdash-backend' \
            | sort > backend/requirements-dev.lock
          grep -qi '^PyJWT==' backend/requirements.lock
          if grep -qi '^ecdsa==' backend/requirements.lock; then
            echo 'ecdsa must not be present in runtime lock'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/requirements.lock backend/requirements-dev.lock
          git diff --cached --check
          git commit -m 'chore(backend): add reproducible dependency locks'
          git push origin HEAD:chore/post-upgrade-hardening

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          if [ -f backend/requirements-dev.lock ]; then
            pip install -r backend/requirements-dev.lock
            pip install --no-deps -e ./backend
          else
            pip install -e './backend[dev]'
          fi

      - name: Format check
        run: ruff format --check backend

      - name: Lint check
        run: ruff check backend

      - name: Type check
        run: mypy backend/app --ignore-missing-imports

      - name: Security static analysis
        run: bandit -r backend/app -q -lll

      - name: Pytest
        run: |
          cd backend
          pytest -q

      - name: Alembic migration check
        run: |
          cd backend
          alembic -c alembic.ini upgrade head

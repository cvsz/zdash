name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Format check
        run: ruff format --check backend

      - name: Lint check
        run: ruff check backend

      - name: Type check
        run: mypy backend/app --ignore-missing-imports

      - name: Security static analysis
        run: bandit -r backend/app -q -lll

      - name: Pytest
        run: |
          cd backend
          pytest -q

      - name: Alembic migration check
        run: |
          cd backend
          alembic -c alembic.ini upgrade head

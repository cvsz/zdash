name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Check backend formatting
        run: python -m ruff format --check backend

      - name: Lint backend
        run: python -m ruff check backend

      - name: Type check backend
        run: mypy backend/app --ignore-missing-imports

      - name: Test backend
        run: |
          cd backend
          python -B -m pytest -q

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --fund=false

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc -p tsconfig.build.json --pretty false

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Test frontend
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-24.04
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile .

      - name: Build nginx image
        run: docker build -f infra/docker/nginx.Dockerfile .

      - name: Validate production environment gate
        run: python3 -m unittest discover -s scripts -p 'test_prod_env.py'

      - name: Validate Compose without shipping example secrets
        run: |
          cp .env.example .env.production
          docker compose -f docker-compose.yml config --quiet
          DATABASE_URL='postgresql+psycopg://zdash:CI-only-nonproduction-password@postgres:5432/zdash' \
            POSTGRES_PASSWORD='CI-only-nonproduction-password' \
            docker compose -f docker-compose.prod.yml config --quiet

  postgres-dr:
    name: postgres-dr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: zdash_dr_ci
          POSTGRES_PASSWORD: ci-only-isolated-dr-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zdash_dr_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DR_TEST_MODE: isolated-ci
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: zdash_dr_ci
      PGPASSWORD: ci-only-isolated-dr-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend and PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Validate safety scripts and governance policy
        run: |
          bash -n scripts/dr/postgres-restore-drill.sh
          bash -n scripts/github/configure-main-protection.sh
          bash scripts/github/configure-main-protection.sh --dry-run | tail -n +2 | python3 -m json.tool >/dev/null

      - name: Prove isolated PostgreSQL dump, restore and migration replay
        run: bash scripts/dr/postgres-restore-drill.sh

name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Check backend formatting
        run: python -m ruff format --check backend

      - name: Lint backend
        run: python -m ruff check backend

      - name: Type check backend
        run: mypy backend/app --ignore-missing-imports

      - name: Test backend
        run: |
          cd backend
          python -B -m pytest -q

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --fund=false

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc -p tsconfig.build.json --pretty false

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Test frontend
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-24.04
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile .

      - name: Build nginx image
        run: docker build -f infra/docker/nginx.Dockerfile .

      - name: Validate compose files
        run: |
          cp .env.example .env.production
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.prod.yml config

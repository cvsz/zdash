name: dependency-upgrade-once

on:
  push:
    branches:
      - feat/dashboard-uiux-mission-control
    paths:
      - .github/workflows/dependency-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/dashboard-uiux-mission-control
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade frontend dependencies and lockfile
        working-directory: frontend
        run: |
          npm install --save \
            i18next@latest \
            lucide-react@latest \
            react@latest \
            react-dom@latest \
            react-i18next@latest \
            react-router-dom@latest \
            recharts@latest
          npm install --save-dev \
            @testing-library/dom@latest \
            @testing-library/jest-dom@latest \
            @testing-library/react@latest \
            @testing-library/user-event@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @vitejs/plugin-react@latest \
            autoprefixer@latest \
            jsdom@latest \
            postcss@latest \
            tailwindcss@latest \
            typescript@latest \
            vite@latest \
            vitest@latest

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade backend dependency floors
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.request
          from pathlib import Path

          path = Path('backend/pyproject.toml')
          text = path.read_text(encoding='utf-8')

          packages = {
              'fastapi': 'fastapi',
              'uvicorn': 'uvicorn',
              'pydantic': 'pydantic',
              'pydantic-settings': 'pydantic-settings',
              'python-dotenv': 'python-dotenv',
              'httpx': 'httpx',
              'sqlmodel': 'sqlmodel',
              'sqlalchemy': 'sqlalchemy',
              'alembic': 'alembic',
              'APScheduler': 'APScheduler',
              'python-jose': 'python-jose',
              'passlib': 'passlib',
              'prometheus-client': 'prometheus-client',
              'email-validator': 'email-validator',
              'psycopg': 'psycopg',
              'pytest': 'pytest',
              'ruff': 'ruff',
              'hatchling': 'hatchling',
          }

          def latest(project: str) -> str:
              with urllib.request.urlopen(f'https://pypi.org/pypi/{project}/json', timeout=30) as response:
                  return json.load(response)['info']['version']

          for token, project in packages.items():
              version = latest(project)
              if token == 'ruff':
                  pattern = rf'("ruff==)[^"]+("\s*,?)'
                  replacement = rf'\g<1>{version}\g<2>'
              elif token == 'hatchling':
                  pattern = rf'("hatchling>=)[^"]+("\s*\])'
                  replacement = rf'\g<1>{version}\g<2>'
              else:
                  escaped = re.escape(token)
                  pattern = rf'("{escaped}(?:\[[^\]]+\])?>=)[^"]+("\s*,?)'
                  replacement = rf'\g<1>{version}\g<2>'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to update {token}')
              print(f'{token} -> {version}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Record dependency inventory
        run: |
          mkdir -p docs/dependencies
          {
            echo '# Dependency Refresh — 2026-08-23'
            echo
            echo 'Generated by the one-shot dependency refresh workflow.'
            echo
            echo '## Frontend direct dependencies'
            echo '```json'
            node -e "const p=require('./frontend/package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"
            echo '```'
            echo
            echo '## Backend requirements'
            echo '```toml'
            sed -n '1,45p' backend/pyproject.toml
            echo '```'
          } > docs/dependencies/2026-08-23-refresh.md

      - name: Commit generated dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json backend/pyproject.toml docs/dependencies/2026-08-23-refresh.md
          if git diff --cached --quiet; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git commit -m 'chore(deps): upgrade frontend and backend dependencies'
          git push origin HEAD:feat/dashboard-uiux-mission-control

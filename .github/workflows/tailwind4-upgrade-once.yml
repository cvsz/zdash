name: tailwind4-upgrade-once

on:
  push:
    branches:
      - feat/dashboard-uiux-mission-control
    paths:
      - .github/workflows/tailwind4-upgrade-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dashboard-uiux-mission-control
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update Tailwind Vite integration
        run: |
          cd frontend
          npm uninstall autoprefixer postcss
          npm install --save-dev @tailwindcss/vite@latest
          cd ..

          python - <<'PY'
          from pathlib import Path

          vite = Path('frontend/vite.config.ts')
          text = vite.read_text(encoding='utf-8')
          if "@tailwindcss/vite" not in text:
              text = text.replace("import react from '@vitejs/plugin-react'\n", "import react from '@vitejs/plugin-react'\nimport tailwindcss from '@tailwindcss/vite'\n")
          text = text.replace('plugins: [react()],', 'plugins: [react(), tailwindcss()],')
          vite.write_text(text, encoding='utf-8')

          css = Path('frontend/src/index.css')
          text = css.read_text(encoding='utf-8')
          old = '@tailwind base;\n@tailwind components;\n@tailwind utilities;'
          new = '@config "../tailwind.config.js";\n@import "tailwindcss";'
          if old not in text:
              raise SystemExit('legacy Tailwind directives not found')
          css.write_text(text.replace(old, new, 1), encoding='utf-8')

          postcss = Path('frontend/postcss.config.js')
          if postcss.exists():
              postcss.unlink()
          PY

          rm .github/workflows/tailwind4-upgrade-once.yml

      - name: Commit Tailwind 4 migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A frontend .github/workflows/tailwind4-upgrade-once.yml
          git commit -m 'chore(frontend): migrate Tailwind 4 to Vite plugin'
          git push origin HEAD:feat/dashboard-uiux-mission-control

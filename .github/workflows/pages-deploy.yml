name: pages-deploy

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install reproducible frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Typecheck, lint and unit tests
        working-directory: frontend
        run: |
          npx tsc -p tsconfig.build.json --pretty false
          npm run lint
          npm test

      - name: Build isolated read-only demo
        working-directory: frontend
        run: npm run build:demo

      - name: Verify Pages base path and static artifact
        run: |
          test -s frontend/dist/index.html
          test -d frontend/dist/assets
          grep -q '/zdash/assets/' frontend/dist/index.html
          test -f frontend/.env.public-demo
          test -f frontend/public-demo.env.example

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy validated demo
        id: deployment
        uses: actions/deploy-pages@v5

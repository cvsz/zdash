name: backend-lock-once

on:
  push:
    branches:
      - chore/post-upgrade-hardening
    paths:
      - .github/workflows/backend-lock-once.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/post-upgrade-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate runtime lock
        run: |
          python -m venv /tmp/zdash-runtime
          /tmp/zdash-runtime/bin/python -m pip install --upgrade pip 'setuptools>=83' wheel
          /tmp/zdash-runtime/bin/pip install ./backend
          /tmp/zdash-runtime/bin/pip freeze \
            | grep -v '^zdash-backend' \
            | sort > backend/requirements.lock

      - name: Generate development lock
        run: |
          python -m venv /tmp/zdash-dev
          /tmp/zdash-dev/bin/python -m pip install --upgrade pip 'setuptools>=83' wheel
          /tmp/zdash-dev/bin/pip install './backend[dev]'
          /tmp/zdash-dev/bin/pip freeze \
            | grep -v '^zdash-backend' \
            | sort > backend/requirements-dev.lock

      - name: Verify lock files
        run: |
          grep -qi '^PyJWT==' backend/requirements.lock
          if grep -qi '^ecdsa==' backend/requirements.lock; then
            echo 'ecdsa must not be present in runtime lock'
            exit 1
          fi
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock

      - name: Commit lock files only
        run: |
          rm .github/workflows/backend-lock-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/requirements.lock backend/requirements-dev.lock .github/workflows/backend-lock-once.yml
          git diff --cached --check
          git commit -m 'chore(backend): add reproducible dependency locks'
          git push origin HEAD:chore/post-upgrade-hardening

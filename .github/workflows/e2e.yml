name: e2e

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zdash
          POSTGRES_PASSWORD: zdash-test
          POSTGRES_DB: zdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd backend
          pip install -e '.[dev]'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --fund=false

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start backend
        run: |
          cd backend
          APP_ENV=test \
          DATABASE_URL=postgresql://zdash:zdash-test@localhost:5432/zdash_test \
          DRY_RUN=true \
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8005 &
          sleep 3

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8005/health && break
            sleep 2
          done

      - name: Smoke test
        run: |
          curl -sf http://127.0.0.1:8005/api/admin/safety-check
          curl -sf http://127.0.0.1:8005/health

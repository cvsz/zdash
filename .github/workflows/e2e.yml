name: e2e

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zdash
          POSTGRES_PASSWORD: zdash-test
          POSTGRES_DB: zdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zdash -d zdash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd backend
          pip install -e '.[dev]'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --fund=false

      - name: Run DB migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://zdash:zdash-test@localhost:5432/zdash_test \
          alembic upgrade head
        env:
          APP_ENV: test

      - name: Run backend tests
        run: |
          cd backend
          DATABASE_URL=postgresql://zdash:zdash-test@localhost:5432/zdash_test \
          python -m pytest -q --tb=short 2>&1 | tail -20
        env:
          APP_ENV: test

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start backend
        run: |
          cd backend
          DATABASE_URL=postgresql://zdash:zdash-test@localhost:5432/zdash_test \
          DRY_RUN=true \
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8005 > /tmp/backend.log 2>&1 &
        env:
          APP_ENV: test

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8005/health > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Auth bootstrap + login
        id: auth
        run: |
          echo "=== Bootstrap Admin ==="
          curl -s -X POST http://127.0.0.1:8005/api/auth/bootstrap-admin \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python3 -m json.tool
          echo "=== Login ==="
          TOKEN=$(curl -s -X POST http://127.0.0.1:8005/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['access_token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Smoke test endpoints
        env:
          AUTH: Bearer ${{ steps.auth.outputs.token }}
        run: |
          echo "=== Health ==="
          curl -sf http://127.0.0.1:8005/health | python3 -m json.tool
          echo "=== Safety Check ==="
          curl -sf http://127.0.0.1:8005/api/admin/safety-check \
            -H "Authorization: $AUTH" | python3 -m json.tool
          echo "=== Marketplace Categories ==="
          curl -sf http://127.0.0.1:8005/api/marketplace/categories \
            -H "Authorization: $AUTH" | python3 -m json.tool
          echo "=== Marketplace Plugins ==="
          curl -sf http://127.0.0.1:8005/api/marketplace/plugins \
            -H "Authorization: $AUTH" | python3 -m json.tool
          echo "=== Marketplace Plugin Detail ==="
          PLUGIN_ID=$(curl -sf http://127.0.0.1:8005/api/marketplace/plugins \
            -H "Authorization: $AUTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['plugins'][0]['id'])")
          curl -sf "http://127.0.0.1:8005/api/marketplace/plugins/${PLUGIN_ID}" \
            -H "Authorization: $AUTH" | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: |
          pkill -f "uvicorn app.main:app" 2>/dev/null || true
          echo "Backend stopped"

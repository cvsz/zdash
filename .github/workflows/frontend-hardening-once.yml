name: frontend-hardening-once

on:
  push:
    branches:
      - chore/post-upgrade-hardening
    paths:
      - .github/workflows/frontend-hardening-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/post-upgrade-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify strict install and add lint toolchain
        run: |
          cd frontend
          npm ci --no-audit --fund=false
          npm install --save-dev \
            eslint@latest \
            @eslint/js@latest \
            typescript-eslint@latest \
            eslint-plugin-react-hooks@latest \
            eslint-plugin-react-refresh@latest \
            --no-audit --fund=false
          npm ls --depth=0

      - name: Commit manifests only
        run: |
          rm .github/workflows/frontend-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json .github/workflows/frontend-hardening-once.yml
          git diff --cached --check
          git commit -m 'chore(frontend): add deterministic ESLint toolchain'
          git push origin HEAD:chore/post-upgrade-hardening

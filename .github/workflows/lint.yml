name: lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Ruff format check
        run: python -m ruff format --check backend

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Mypy
        run: mypy backend/app --ignore-missing-imports

  frontend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --fund=false

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc -p tsconfig.build.json --pretty false

      - name: ESLint
        run: |
          cd frontend
          npm run lint

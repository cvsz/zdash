name: frontend-ci

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'

permissions:
  contents: write

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate strict frontend lock on maintenance branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/post-upgrade-hardening'
        run: |
          git fetch origin chore/post-upgrade-hardening
          git checkout chore/post-upgrade-hardening

          if ! grep -q '"eslint"' frontend/package.json; then
            cd frontend
            npm install --save-dev \
              eslint@latest \
              @eslint/js@latest \
              typescript-eslint@latest \
              eslint-plugin-react-hooks@latest \
              eslint-plugin-react-refresh@latest \
              --no-audit --fund=false
            npm pkg set scripts.lint="eslint src --max-warnings=0"
            npm pkg set overrides.nanoid="3.3.18"
            npm install --package-lock-only --no-audit --fund=false
            npm audit --audit-level=high
            cd ..
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/package.json frontend/package-lock.json
            git diff --cached --check
            git commit -m 'chore(frontend): lock strict lint and audit dependencies'
            git push origin HEAD:chore/post-upgrade-hardening
          else
            echo 'Frontend hardening dependencies are already locked.'
          fi

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --no-audit --fund=false

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc -p tsconfig.build.json --pretty false

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Test
        run: |
          cd frontend
          npm test

      - name: Build
        run: |
          cd frontend
          npm run build

name: Upgrade artifact action once

on:
  push:
    branches:
      - fix/complete-main-ci-20260805

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/complete-main-ci-20260805

      - name: Export upgraded workflows
        run: |
          rm -rf workflow-runtime-output
          mkdir -p workflow-runtime-output
          for file in .github/workflows/*.yml; do
            name="$(basename "$file")"
            [ "$name" = "upgrade-artifact-action-once.yml" ] && continue
            sed -E 's#actions/upload-artifact@v[0-9]+#actions/upload-artifact@v7#g' \
              "$file" > "workflow-runtime-output/$name"
          done

      - name: Validate and persist output
        run: |
          if grep -R -nE 'actions/upload-artifact@v[0-6]' workflow-runtime-output; then
            echo 'Legacy upload-artifact version remains' >&2
            exit 1
          fi
          git add workflow-runtime-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: export artifact action v7 workflows"
          git push origin HEAD:fix/complete-main-ci-20260805

name: Format backend once

on:
  push:
    branches:
      - fix/complete-main-ci-20260805

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/complete-main-ci-20260805

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd backend
          pip install -e '.[dev]'

      - name: Apply Ruff autofixes and formatting
        run: |
          cd backend
          python -m ruff check app tests --fix --unsafe-fixes || true
          python -m ruff format app tests
          python -m ruff check app tests > ../ruff-residual.txt 2>&1 || true

      - name: Persist results and remove one-time workflow
        run: |
          rm .github/workflows/format-backend-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply canonical Ruff fixes"
          git push origin HEAD:fix/complete-main-ci-20260805

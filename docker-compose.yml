name: ${COMPOSE_PROJECT_NAME:-zdash-local}

services:
  gateway:
    build:
      context: .
      dockerfile: infra/docker/nginx.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${ZDASH_BIND_ADDRESS:-127.0.0.1}:${ZDASH_HTTP_PORT:-18080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - zdash_net

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8005
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zdash}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-zdash}
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_ALLOW_BOOTSTRAP_IN_PRODUCTION: ${AUTH_ALLOW_BOOTSTRAP_IN_PRODUCTION:-false}
      METRICS_AUTH_REQUIRED: ${METRICS_AUTH_REQUIRED:-false}
      METRICS_ALLOW_UNAUTHENTICATED_DEV: ${METRICS_ALLOW_UNAUTHENTICATED_DEV:-true}
      DRY_RUN: ${DRY_RUN:-true}
      LIVE_TRADING_ACK: ${LIVE_TRADING_ACK:-false}
      MT5_ENABLED: ${MT5_ENABLED:-false}
      RISK_GUARDIAN_ENABLED: ${RISK_GUARDIAN_ENABLED:-true}
      SOCIAL_DRY_RUN: ${SOCIAL_DRY_RUN:-true}
      SOCIAL_APPROVAL_REQUIRED: ${SOCIAL_APPROVAL_REQUIRED:-true}
      SOCIAL_AUTO_POST_ENABLED: ${SOCIAL_AUTO_POST_ENABLED:-false}
      SOCIAL_REAL_POSTING_APPROVED: ${SOCIAL_REAL_POSTING_APPROVED:-false}
      IOT_DRY_RUN: ${IOT_DRY_RUN:-true}
      IOT_REQUIRE_CONFIRMATION: ${IOT_REQUIRE_CONFIRMATION:-true}
      IOT_REAL_ACTIONS_APPROVED: ${IOT_REAL_ACTIONS_APPROVED:-false}
      ALLOW_STRATEGY_PROMOTION: ${ALLOW_STRATEGY_PROMOTION:-false}
      PRODUCTION_SAFETY_LOCK: ${PRODUCTION_SAFETY_LOCK:-true}
      PRODUCTION_ALLOW_LIVE_ACTIONS: ${PRODUCTION_ALLOW_LIVE_ACTIONS:-false}
      MULTI_TENANT_ENABLED: ${MULTI_TENANT_ENABLED:-false}
      WORKER_QUEUE_BACKEND: ${WORKER_QUEUE_BACKEND:-memory}
      CLOUDFLARE_DRY_RUN: ${CLOUDFLARE_DRY_RUN:-true}
      NOTIFICATION_DRY_RUN: ${NOTIFICATION_DRY_RUN:-true}
    expose:
      - "8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - zdash_net

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_ENABLE_MOCK_FALLBACK: ${VITE_ENABLE_MOCK_FALLBACK:-false}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - zdash_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-zdash}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zdash} -d ${POSTGRES_DB:-zdash}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - zdash_net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks:
      - zdash_net

networks:
  zdash_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  backend_data:
